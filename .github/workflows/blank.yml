name: Meta-Learning Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-meta:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv (package manager)
      run: pip install uv

    - name: Sync dependencies
      run: uv sync

    - name: Run experiments
      run: |
        uv run python examples/meta_learning/example_acla.py
        uv run python examples/meta_learning/example_clrs.py
